<!doctype html>
<html lang="en" style="scroll-behavior: smooth; text-rendering: optimizeSpeed; -webkit-font-smoothing: antialiased;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kira Skincare - Luxury Organic Cosmetics</title>

    <!-- Preload critical assets for sub-1-second loading -->
    <link rel="preload" href="/360 rotate Kira 60˚ C-Tide Cream.mp4" as="video" type="video/mp4" crossorigin="anonymous" />
    <link rel="preload" href="/360 rotate E-BAP Powder Cleanser.webm" as="video" type="video/webm" crossorigin="anonymous" />
    <link rel="preload" href="/360 rotate Cica Pin Cell Skin Trigger (Set of 2).webm" as="video" type="video/webm" crossorigin="anonymous" />
    
    <!-- Inline ultra-fast asset caching script -->
    <script>
      (function() {
        const criticalAssets = [
          "/360 rotate Kira 60˚ C-Tide Cream.mp4",
          "/360 rotate E-BAP Powder Cleanser.webm",
          "/360 rotate Cica Pin Cell Skin Trigger (Set of 2).webm",
          "/E-BAP Powder Cleanser left side image.png",
          "/Brightening support with vitamins section Kira 60˚ C-Tide Cream right side image.png"
        ];
        criticalAssets.forEach(url => {
          if (url.endsWith('.mp4') || url.endsWith('.webm')) {
            const req = new XMLHttpRequest();
            req.open('GET', url, true);
            req.responseType = 'blob';
            req.send();
          } else {
            const img = new Image();
            img.src = url;
          }
        });
      })();
    </script>
    
    <style>
      /* Ensure that the browser prioritizes fast scroll rendering and handles offscreen elements optimally */
      html, body {
        scroll-behavior: smooth !important;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior-y: none;
      }
      canvas, img, video {
        content-visibility: auto; /* Defer rendering of offscreen assets */
      }
    </style>
  </head>
  <body class="bg-[#FAF8F5] text-stone-900 overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
